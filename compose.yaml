services:
  goclipboard:
    build: .
    container_name: goclipboard
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      # Admin password for upload + delete. Download uses a per-file password set at upload.
      UPLOAD_PASSWORD: "change-me"
      FILE_DIR: "/data/files"
      TMPDIR: "/data/tmp"
    volumes:
      - goclipboard-data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      retries: 3
      start_period: 5s

volumes:
  goclipboard-data:
