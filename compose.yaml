services:
  goclipboard:
    build: .
    container_name: goclipboard
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
      # Admin password for upload + delete. Download uses a per-file password set at upload.
      UPLOAD_PASSWORD: "change-me"
      FILE_DIR: "/data/files"
      TMPDIR: "/data/tmp"
    volumes:
      - goclipboard-data:/data
    healthcheck:
      # scratch 镜像没有 curl/wget —— 用二进制自带的 -healthcheck 模式探测 /healthz
      test: ["CMD", "/goclipboard", "-healthcheck"]
      interval: 30s
      retries: 3
      start_period: 5s

volumes:
  goclipboard-data:
