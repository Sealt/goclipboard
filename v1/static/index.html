<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>临时云剪贴板</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="label">Cloud Clipboard</p>
          <h1 id="roomTitle">临时云剪贴板</h1>
        </div>
        <div class="status" id="status" role="status">连接中</div>
      </header>

      <section class="toolbar" aria-label="剪贴板设置">
        <label class="field">
          <span>TTL</span>
          <div class="ttl-group">
            <input id="ttlValue" type="number" min="1" inputmode="numeric" value="1">
            <select id="ttlUnit" aria-label="TTL 单位">
              <option value="60">分钟</option>
              <option value="3600" selected>小时</option>
              <option value="86400">天</option>
            </select>
          </div>
        </label>
        <div class="meta">
          <span id="expiresText">未保存</span>
          <span id="versionText">v0</span>
        </div>
      </section>

      <textarea id="content" spellcheck="false" placeholder="把要临时分享的文本放在这里"></textarea>

      <footer class="actions">
        <button id="reloadButton" type="button" class="secondary">刷新</button>
        <button id="clearButton" type="button" class="danger">清空</button>
      </footer>
    </main>

    <script src="/static/app.js" defer></script>
  </body>
</html>
