  <rect x="50" y="20" width="28" height="18" rx="7" fill="#f6f7f8" stroke="#0969da" stroke-width="5"/>
  <!-- text lines on board -->
  <rect x="46" y="52" width="36" height="5" rx="2.5" fill="#8b949e"/>
  <rect x="46" y="66" width="26" height="5" rx="2.5" fill="#8b949e"/>
  <rect x="46" y="80" width="30" height="5" rx="2.5" fill="#8b949e"/>
