<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoClipboard</title>
    <!-- Room keys are arbitrary single path segments, so an undeclared icon
         made the browser request /favicon.ico, which used to open a room. -->
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <meta name="robots" content="noindex, nofollow">
    <!-- bump ?v= when static assets change so CF/browser don't mix old JS with new HTML -->
    <link rel="stylesheet" href="/static/styles.css?v=20261023e">
    <!-- highlight.js theme is attached on first Markdown preview (see
         ensureHljsTheme) so it does not cost a render-blocking round trip. -->
  </head>
  <body>
    <main class="app">
      <header class="chrome">
        <!-- Row 1: brand/path | status · controls (stacked) -->
        <div class="top-row">
          <div class="brand">
            <p class="brand-name">GoClipboard</p>
            <div class="path-row">
              <h1 id="roomTitle" class="path">/</h1>
              <!-- Copying the room URL is the most common follow-up to
                   opening a room; a dedicated button leaves the title's
                   triple-click admin gesture untouched. -->
              <button id="copyRoomBtn" type="button" class="path-copy" title="复制房间链接" aria-label="复制房间链接" data-i18n-aria="复制房间链接" aria-live="polite">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
              </button>
            </div>
          </div>

          <div class="top-right">
            <!-- Layer 1: expiry — the one piece of metadata worth a glance -->
            <div class="meta">
              <span id="expiresText" data-tone="idle">尚未保存</span>
            </div>

            <!-- Layer 2: TTL + action buttons -->
            <div class="top-controls">
              <label class="ttl-field">
                <span class="ttl-lab" data-i18n="有效期">有效期</span>
                <div class="ttl-group">
                  <input id="ttlValue" type="number" min="1" inputmode="numeric" value="1" aria-label="TTL 数值" data-i18n-aria="TTL 数值">
                  <select id="ttlUnit" aria-label="TTL 单位" data-i18n-aria="TTL 单位">
                    <option value="60" data-i18n="分钟">分钟</option>
                    <option value="3600" selected data-i18n="小时">小时</option>
                    <option value="86400" data-i18n="天">天</option>
                  </select>
                </div>
              </label>
              <!-- Grouped so phones can drop the whole toolbar onto its own
                   row; keeping the buttons as flat siblings let flex shrink
                   the TTL field to zero width. Document actions and app-wide
                   utilities are separated so eight identical icons read as two
                   short groups. -->
              <div class="action-group">
                <button id="undoBtn" type="button" class="icon-btn" title="撤销" aria-label="撤销" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
                </button>
                <button id="redoBtn" type="button" class="icon-btn" title="重做" aria-label="重做" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5A5.5 5.5 0 0 0 9.5 20H13"/></svg>
                </button>
                <button id="previewBtn" type="button" class="icon-btn" title="Markdown 预览" aria-label="Markdown 预览" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
                <button id="historyBtn" type="button" class="icon-btn" title="版本历史" aria-label="版本历史">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
                </button>
                <button id="shareBtn" type="button" class="icon-btn" title="分享链接" aria-label="分享链接">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
                </button>
                <button id="newRoomBtn" type="button" class="icon-btn" title="新建房间" aria-label="新建房间">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
                </button>
                <span class="action-sep" aria-hidden="true"></span>
                <button id="langBtn" type="button" class="icon-btn lang-btn" title="语言" aria-label="语言" data-lang="zh">
                  <span class="lang-mono" aria-hidden="true">EN</span>
                </button>
                <button id="themeBtn" type="button" class="icon-btn" title="切换主题" aria-label="切换主题">
                  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Row 2: peers (scroll) · status · dots (pinned right) -->
        <div class="presence-row" id="presenceRow">
          <div class="peer-tabs" id="peerTabs" role="group" aria-label="在线用户" data-i18n-aria="在线用户"></div>
          <div class="presence-end">
            <!-- Edit-locked rooms stay readable; this is the way in for
                 writing, so reading is never interrupted by a prompt. -->
            <button id="unlockEditBtn" type="button" class="unlock-chip" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <span data-i18n="只读 · 解锁编辑">只读 · 解锁编辑</span>
            </button>
            <p id="status" class="status" role="status" aria-live="polite" data-tone="pending">
              <span class="status-dot" aria-hidden="true"></span>
              <span class="status-text">加载中…</span>
            </p>
            <span class="dots" aria-hidden="true">
              <span id="dotUp" class="dot dot-up" title="发送"></span>
              <span id="dotDown" class="dot dot-down" title="接收"></span>
            </span>
          </div>
        </div>

      </header>

      <div class="editor-wrapper">
        <textarea id="content" spellcheck="false" data-i18n-placeholder="粘贴或输入文本，内容会自动保存 · 开启上传后可粘贴/拖入文件" placeholder="粘贴或输入文本，内容会自动保存 · 开启上传后可粘贴/拖入文件"></textarea>
        <!-- First-run affordance: an empty textarea with a long placeholder
             says what the box is, not what to do next. Hidden the moment the
             room has any content or the user starts typing. -->
        <div id="emptyHint" class="empty-hint" hidden>
          <p class="empty-hint-title" data-i18n="直接粘贴或输入内容">直接粘贴或输入内容</p>
          <p class="empty-hint-sub" data-i18n="内容实时同步给打开同一链接的人，到期自动销毁">内容实时同步给打开同一链接的人，到期自动销毁</p>
          <div class="empty-hint-actions">
            <button id="emptyPasteBtn" type="button" class="btn-sm" data-i18n="从剪贴板粘贴">从剪贴板粘贴</button>
            <button id="emptyShareBtn" type="button" class="btn-sm" data-i18n="复制房间链接">复制房间链接</button>
          </div>
        </div>
        <div id="previewPane" class="preview-pane" hidden><div id="previewBody" class="md-body"></div></div>
        <!-- Room gate: shown instead of the editor when the room needs a
             password. One panel covers both scopes, so the user sees the lock
             before typing instead of discovering it when a save is rejected. -->
        <div id="roomLock" class="room-lock" hidden>
          <form id="roomLockForm" class="room-lock-card" novalidate>
            <div class="room-lock-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h2 id="roomLockTitle" class="room-lock-title"></h2>
            <p id="roomLockHint" class="room-lock-hint"></p>
            <label class="room-lock-field">
              <span class="sr-only" id="roomLockLabel"></span>
              <input id="roomLockPassword" type="password" autocomplete="current-password" data-i18n-placeholder="密码" placeholder="密码">
            </label>
            <p id="roomLockError" class="room-lock-error" role="alert"></p>
            <button id="roomLockSubmit" type="submit" class="primary room-lock-submit" data-i18n="解锁">解锁</button>
          </form>
        </div>
        <div id="cursorLayer" class="cursor-layer" aria-hidden="true"></div>
        <div id="cursorMirror" class="cursor-mirror" aria-hidden="true"></div>
        <!-- Visual only: #status already announces state to screen readers. -->
        <div id="loadingOverlay" class="loading-overlay" aria-hidden="true">
          <span class="loading-spinner"></span>
          <span id="loadingText" class="loading-text" data-i18n="正在加载剪贴板…">正在加载剪贴板…</span>
        </div>
      </div>

      <!-- Hidden when empty; only lists existing files -->
      <section id="filesPanel" class="files-panel" aria-label="文件" hidden>
        <div class="files-header">
          <h2 class="files-title" data-i18n="文件">文件</h2>
          <span id="filesCount" class="files-count">0</span>
          <p id="filesStatus" class="files-status" role="status" aria-live="polite"></p>
        </div>
        <ul id="fileList" class="file-list"></ul>
      </section>
    </main>

    <!-- Password dialog for file upload / download / delete -->
    <div id="passwordModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="modalTitle" class="modal-title" data-i18n="输入密码">输入密码</h3>
            <p id="modalHint" class="modal-hint"></p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <ul id="modalFileNames" class="modal-files"></ul>
          <label class="modal-field">
            <span id="modalPasswordLab" class="modal-lab" data-i18n="密码">密码</span>
            <div class="modal-password-row">
              <input id="modalPassword" type="password" autocomplete="current-password" data-i18n-placeholder="密码" placeholder="密码">
              <button id="modalPasswordGen" type="button" class="ghost" hidden data-i18n="重新生成">重新生成</button>
            </div>
          </label>
          <div id="modalScopeWrap" class="modal-scope" hidden>
            <label class="modal-scope-opt"><input type="radio" name="roomPassScope" value="edit" checked><span data-i18n="仅编辑需要密码">仅编辑需要密码</span></label>
            <label class="modal-scope-opt"><input type="radio" name="roomPassScope" value="view"><span data-i18n="查看和编辑都需要密码">查看和编辑都需要密码</span></label>
          </div>
          <p id="modalError" class="modal-error" role="alert"></p>
        </div>
        <div class="modal-actions">
          <button id="modalCancel" type="button" class="ghost" data-i18n="取消">取消</button>
          <button id="modalConfirm" type="button" class="primary" data-i18n="确认">确认</button>
        </div>
      </div>
    </div>

    <!-- Generic confirm dialog (replaces window.confirm) -->
    <div id="confirmModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="confirmTitle" class="modal-title"></h3>
            <p id="confirmMessage" class="modal-hint"></p>
          </div>
        </div>
        <div class="modal-actions">
          <button id="confirmCancel" type="button" class="ghost" data-i18n="取消">取消</button>
          <button id="confirmOk" type="button" class="primary"></button>
        </div>
      </div>
    </div>

    <!-- Share links + QR code -->
    <div id="shareModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="shareTitle" class="modal-title" data-i18n="分享链接">分享链接</h3>
            <p id="shareHint" class="modal-hint"></p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="share-body">
            <div class="share-qr-row">
              <div class="share-qr-wrap" id="shareQrWrap"></div>
              <p id="shareQrNote" class="share-qr-note"></p>
            </div>
            <div class="share-links">
              <div class="share-link-row">
                <span class="share-link-lab" data-i18n="房间链接">房间链接</span>
                <span class="share-link-value" id="shareRoomUrl"></span>
                <button id="shareRoomCopy" type="button" class="primary btn-sm">复制</button>
              </div>
              <div class="share-link-row">
                <span class="share-link-lab" data-i18n="房间密码">房间密码</span>
                <span class="share-link-value share-pass-value" id="sharePassValue"></span>
                <button id="sharePassCopy" type="button" class="btn-sm" data-i18n="设置">设置</button>
                <button id="sharePassReset" type="button" class="share-mini btn-sm" hidden data-i18n="修改">修改</button>
                <button id="sharePassUnlock" type="button" class="share-mini btn-sm" hidden data-i18n="解除锁定">解除锁定</button>
              </div>
              <div class="share-link-row">
                <span class="share-link-lab" data-i18n="打开方式">打开方式</span>
                <select id="shareMode" class="share-mode" aria-label="打开方式" data-i18n-aria="打开方式">
                  <option value="plain" selected data-i18n="纯文本">纯文本</option>
                  <option value="md" data-i18n="Markdown 预览">Markdown 预览</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="shareClose" type="button" class="ghost" data-i18n="关闭">关闭</button>
        </div>
      </div>
    </div>

    <!-- Version history -->
    <div id="historyModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="historyTitle" class="modal-title" data-i18n="版本历史">版本历史</h3>
            <p id="historyHint" class="modal-hint" data-i18n="点击条目预览，确认后再恢复">点击条目预览，确认后再恢复</p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body">
          <p id="historyWarn" class="history-warn" role="note" data-i18n="注意：历史会保留已删除/覆盖的内容，分享链接前请先清空或设密码">注意：历史会保留已删除/覆盖的内容，分享链接前请先清空或设密码</p>
          <ul id="historyList" class="history-list"></ul>
        </div>
        <div class="modal-actions history-actions">
          <button id="historyClear" type="button" class="ghost history-clear-btn" data-i18n="清空历史">清空历史</button>
          <button id="historyClose" type="button" class="ghost" data-i18n="关闭">关闭</button>
          <button id="historyCapture" type="button" class="primary" data-i18n="存档当前版本">存档当前版本</button>
        </div>
      </div>
    </div>

    <!-- Snapshot quick preview (stacked above history) -->
    <div id="historyPreviewModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card history-preview-card" role="dialog" aria-modal="true" aria-labelledby="historyPreviewTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="historyPreviewTitle" class="modal-title" data-i18n="版本预览">版本预览</h3>
            <p id="historyPreviewMeta" class="modal-hint"></p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
          </button>
        </div>
        <div class="modal-body history-preview-body-wrap">
          <pre id="historyPreviewBody" class="history-preview-body"></pre>
        </div>
        <div class="modal-actions">
          <button id="historyPreviewClose" type="button" class="ghost" data-i18n="关闭">关闭</button>
          <button id="historyPreviewRestore" type="button" class="primary" data-i18n="恢复此版本">恢复此版本</button>
        </div>
      </div>
    </div>

    <!-- Markdown / syntax highlight / QR are only needed for the preview and
         share dialogs, so app.js loads them on demand. Keeping them out of the
         blocking set removes ~210 KB from the path to first content. -->
    <script src="/static/crdt.js?v=20260804j" defer></script>
    <script src="/static/app.js?v=20261023e" defer></script>
  </body>
</html>
