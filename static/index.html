<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GoClipboard</title>
    <!-- bump ?v= when static assets change so CF/browser don't mix old JS with new HTML -->
    <link rel="stylesheet" href="/static/styles.css?v=20260804t">
    <link id="hljsTheme" rel="stylesheet" href="/static/vendor/highlight.github.css">
  </head>
  <body>
    <main class="app">
      <header class="chrome">
        <!-- Row 1: brand/path | status · controls (stacked) -->
        <div class="top-row">
          <div class="brand">
            <p class="brand-name">GoClipboard</p>
            <div class="path-row">
              <h1 id="roomTitle" class="path">/</h1>
            </div>
          </div>

          <div class="top-right">
            <!-- Layer 1: status -->
            <div class="meta">
              <span id="expiresText">尚未保存</span>
            </div>

            <!-- Layer 2: TTL + action buttons -->
            <div class="top-controls">
              <label class="ttl-field">
                <span class="ttl-lab">TTL</span>
                <div class="ttl-group">
                  <input id="ttlValue" type="number" min="1" inputmode="numeric" value="1" aria-label="TTL 数值" data-i18n-aria="TTL 数值">
                  <select id="ttlUnit" aria-label="TTL 单位" data-i18n-aria="TTL 单位">
                    <option value="60" data-i18n="分钟">分钟</option>
                    <option value="3600" selected data-i18n="小时">小时</option>
                    <option value="86400" data-i18n="天">天</option>
                  </select>
                </div>
              </label>
              <button id="undoBtn" type="button" class="icon-btn" title="撤销" aria-label="撤销" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
              </button>
              <button id="redoBtn" type="button" class="icon-btn" title="重做" aria-label="重做" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              </button>
              <button id="previewBtn" type="button" class="icon-btn" title="Markdown 预览" aria-label="Markdown 预览">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              </button>
              <button id="historyBtn" type="button" class="icon-btn" title="版本历史" aria-label="版本历史">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              </button>
              <button id="shareBtn" type="button" class="icon-btn" title="分享链接" aria-label="分享链接">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg>
              </button>
              <button id="langBtn" type="button" class="icon-btn lang-btn" title="语言" aria-label="语言" data-lang="zh">
                <span class="lang-mono" aria-hidden="true">EN</span>
              </button>
              <button id="themeBtn" type="button" class="icon-btn" title="切换主题" aria-label="切换主题">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Row 2: peers (scroll) · status · dots (pinned right) -->
        <div class="presence-row" id="presenceRow">
          <div class="peer-tabs" id="peerTabs" aria-label="在线用户"></div>
          <div class="presence-end">
            <p id="status" class="status" role="status" aria-live="polite" data-tone="err">error</p>
            <span class="dots" aria-hidden="true">
              <span id="dotUp" class="dot dot-up" title="发送"></span>
              <span id="dotDown" class="dot dot-down" title="接收"></span>
            </span>
          </div>
        </div>

      </header>

      <div class="editor-wrapper">
        <textarea id="content" spellcheck="false" data-i18n-placeholder="粘贴或输入文本，内容会自动保存 · 开启上传后可粘贴/拖入文件" placeholder="粘贴或输入文本，内容会自动保存 · 开启上传后可粘贴/拖入文件"></textarea>
        <div id="previewPane" class="preview-pane" hidden><div id="previewBody" class="md-body"></div></div>
        <div id="cursorLayer" class="cursor-layer" aria-hidden="true"></div>
        <div id="cursorMirror" class="cursor-mirror" aria-hidden="true"></div>
      </div>

      <!-- Hidden when empty; only lists existing files -->
      <section id="filesPanel" class="files-panel" aria-label="文件" hidden>
        <div class="files-header">
          <h2 class="files-title" data-i18n="文件">文件</h2>
          <span id="filesCount" class="files-count">0</span>
          <p id="filesStatus" class="files-status" role="status" aria-live="polite"></p>
        </div>
        <ul id="fileList" class="file-list"></ul>
      </section>
    </main>

    <!-- Password dialog for file upload / download / delete -->
    <div id="passwordModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="modalTitle" class="modal-title" data-i18n="输入密码">输入密码</h3>
            <p id="modalHint" class="modal-hint"></p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <ul id="modalFileNames" class="modal-files"></ul>
          <label class="modal-field">
            <span id="modalPasswordLab" class="modal-lab" data-i18n="密码">密码</span>
            <div class="modal-password-row">
              <input id="modalPassword" type="password" autocomplete="current-password" data-i18n-placeholder="密码" placeholder="密码">
              <button id="modalPasswordGen" type="button" class="ghost" hidden data-i18n="重新生成">重新生成</button>
            </div>
          </label>
          <div id="modalScopeWrap" class="modal-scope" hidden>
            <label class="modal-scope-opt"><input type="radio" name="roomPassScope" value="edit" checked><span data-i18n="仅编辑需要密码">仅编辑需要密码</span></label>
            <label class="modal-scope-opt"><input type="radio" name="roomPassScope" value="view"><span data-i18n="查看和编辑都需要密码">查看和编辑都需要密码</span></label>
          </div>
          <p id="modalError" class="modal-error" role="alert"></p>
        </div>
        <div class="modal-actions">
          <button id="modalCancel" type="button" class="ghost" data-i18n="取消">取消</button>
          <button id="modalConfirm" type="button" class="primary" data-i18n="确认">确认</button>
        </div>
      </div>
    </div>

    <!-- Share links + QR code -->
    <div id="shareModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="shareTitle" class="modal-title" data-i18n="分享链接">分享链接</h3>
            <p id="shareHint" class="modal-hint"></p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <div class="share-body">
            <div class="share-qr-row">
              <div class="share-qr-wrap" id="shareQrWrap"></div>
              <p id="shareQrNote" class="share-qr-note"></p>
            </div>
            <div class="share-links">
              <div class="share-link-row">
                <span class="share-link-lab" data-i18n="房间链接">房间链接</span>
                <span class="share-link-value" id="shareRoomUrl"></span>
                <button id="shareRoomCopy" type="button" class="primary btn-sm">复制</button>
              </div>
              <div class="share-link-row">
                <span class="share-link-lab" data-i18n="房间密码">房间密码</span>
                <span class="share-link-value share-pass-value" id="sharePassValue"></span>
                <button id="sharePassCopy" type="button" class="btn-sm" data-i18n="设置">设置</button>
                <button id="sharePassReset" type="button" class="share-mini btn-sm" hidden data-i18n="修改">修改</button>
                <button id="sharePassUnlock" type="button" class="share-mini btn-sm" hidden data-i18n="解除锁定">解除锁定</button>
              </div>
              <div class="share-link-row">
                <span class="share-link-lab" data-i18n="打开方式">打开方式</span>
                <select id="shareMode" class="share-mode" aria-label="打开方式" data-i18n-aria="打开方式">
                  <option value="plain" selected data-i18n="纯文本">纯文本</option>
                  <option value="md" data-i18n="Markdown 预览">Markdown 预览</option>
                </select>
              </div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button id="shareClose" type="button" class="ghost" data-i18n="关闭">关闭</button>
        </div>
      </div>
    </div>

    <!-- Version history -->
    <div id="historyModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="historyTitle" class="modal-title" data-i18n="版本历史">版本历史</h3>
            <p id="historyHint" class="modal-hint" data-i18n="点击条目预览，确认后再恢复">点击条目预览，确认后再恢复</p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body">
          <p id="historyWarn" class="history-warn" role="note" data-i18n="注意：历史会保留已删除/覆盖的内容，分享链接前请先清空或设密码">注意：历史会保留已删除/覆盖的内容，分享链接前请先清空或设密码</p>
          <ul id="historyList" class="history-list"></ul>
        </div>
        <div class="modal-actions history-actions">
          <button id="historyClear" type="button" class="ghost history-clear-btn" data-i18n="清空历史">清空历史</button>
          <button id="historyClose" type="button" class="ghost" data-i18n="关闭">关闭</button>
          <button id="historyCapture" type="button" class="primary" data-i18n="存档当前版本">存档当前版本</button>
        </div>
      </div>
    </div>

    <!-- Snapshot quick preview (stacked above history) -->
    <div id="historyPreviewModal" class="modal" hidden>
      <div class="modal-backdrop" data-modal-dismiss></div>
      <div class="modal-card history-preview-card" role="dialog" aria-modal="true" aria-labelledby="historyPreviewTitle">
        <div class="modal-header">
          <div class="modal-header-text">
            <h3 id="historyPreviewTitle" class="modal-title" data-i18n="版本预览">版本预览</h3>
            <p id="historyPreviewMeta" class="modal-hint"></p>
          </div>
          <button type="button" class="modal-close" data-modal-dismiss aria-label="关闭" data-i18n-aria="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6L6 18M6 6l12 12"></path></svg>
          </button>
        </div>
        <div class="modal-body history-preview-body-wrap">
          <pre id="historyPreviewBody" class="history-preview-body"></pre>
        </div>
        <div class="modal-actions">
          <button id="historyPreviewClose" type="button" class="ghost" data-i18n="关闭">关闭</button>
          <button id="historyPreviewRestore" type="button" class="primary" data-i18n="恢复此版本">恢复此版本</button>
        </div>
      </div>
    </div>

    <script src="/static/crdt.js?v=20260804j" defer></script>
    <script src="/static/vendor/marked.min.js" defer></script>
    <script src="/static/vendor/highlight.min.js" defer></script>
    <script src="/static/vendor/qrcode.min.js" defer></script>
    <script src="/static/app.js?v=20260804v" defer></script>
  </body>
</html>
