<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Tab icon. Bold shapes and a 3px stroke so it still reads at 16px, where
       the detailed 128px logo turned to mush. The clipboard fills most of the
       tile: at favicon size, padding costs legibility.
       Colors reuse the app accent (#0969da) from the light theme. -->
  <rect width="32" height="32" rx="7" fill="#0969da"/>
  <rect x="6.5" y="7.5" width="19" height="19" rx="4" fill="#ffffff"/>
  <rect x="11.5" y="4" width="9" height="7" rx="2.5" fill="#ffffff"/>
  <rect x="13.5" y="6" width="5" height="3" rx="1.5" fill="#0969da"/>
  <path d="M11 15.5h10M11 20.5h6.5" stroke="#0969da" stroke-width="3" stroke-linecap="round"/>
</svg>
